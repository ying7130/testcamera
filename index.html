<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>門市品號辨識系統 V3.6</title>
    <!-- 載入 Tesseract.js OCR 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            margin: 0;
        }

        h2 { margin: 10px 0; font-size: 20px; }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: #007bff;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 第一階段 3000x2000 取景與劃框容器 */
        .camera-area {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 3000 / 2000;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #ff9800;
            border-radius: 8px;
            touch-action: none; /* 阻止瀏覽器預設捲動 */
        }

        /* 第二階段 1000x905 產品拍照容器 */
        .product-area {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1000 / 905;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #28a745;
            border-radius: 8px;
        }

        video.layer, canvas.layer {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            object-fit: cover;
        }

        #video { z-index: 1; }
        #freezeCanvas { z-index: 3; display: none; }
        #boxCanvas { z-index: 5; }

        #productFreezeCanvas {
            z-index: 4;
            display: none;
        }

        /* 放大鏡 */
        #zoomBox {
            display: none;
            width: 320px;
            height: 130px;
            margin: 10px auto;
            border: 2px solid #333;
            background: white;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #zoomCanvas { width: 100%; height: 100%; }

        button {
            padding: 8px 14px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { background: #ccc; }
        .green { background: #28a745; }
        .orange { background: #ff9800; }
        .gray { background: #6c757d; }
        .red { background: #dc3545; }
        .purple { background: #6f42c1; }

        #status { font-weight: bold; margin: 10px; color: #333; font-size: 14px; }

        #resultPanel {
            max-width: 350px;
            margin: 10px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }

        .result-item {
            padding: 12px;
            margin: 6px 0;
            background: #f8f9fa;
            border: 2px solid #ddd;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .result-item.selected {
            background: #e7f1ff;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
            color: #0056b3;
        }

        /* 旋轉控制列 */
        .transform-controls {
            margin: 10px auto;
            max-width: 900px;
            padding: 8px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: none;
        }

        .slider-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .slider-group input[type=range] {
            width: 55%;
        }
    </style>
</head>
<body>

    <h2>門市品號辨識系統 V3.6</h2>

    <div id="stepTitle" class="badge">第一階段：品號辨識</div>

    <!-- 第一階段 3000x2000 取景與劃框容器 -->
    <div id="cameraBox" class="camera-area">
        <video id="video" class="layer" autoplay playsinline muted></video>
        <canvas id="freezeCanvas" class="layer" width="3000" height="2000"></canvas>
        <canvas id="boxCanvas" class="layer" width="3000" height="2000"></canvas>
    </div>

    <!-- 精密旋轉角度微調列 -->
    <div id="transformBar" class="transform-controls">
        <div class="slider-group">
            <span style="font-weight:bold; font-size:14px;">旋轉微調:</span>
            <button onclick="stepRotate(-1)" class="purple">-1°</button>
            <input type="range" id="rotateSlider" min="-180" max="180" value="0" oninput="onRotateSliderChange(this.value)">
            <button onclick="stepRotate(1)" class="purple">+1°</button>
            <span id="degVal" style="font-weight:bold; min-width:40px;">0°</span>
            <button onclick="resetImageTransform()" class="gray" style="font-size:12px; padding:4px 8px;">重置照片</button>
        </div>
    </div>

    <!-- 放大鏡 -->
    <div id="zoomBox">
        <canvas id="zoomCanvas" width="600" height="240"></canvas>
    </div>

    <div>
        <button id="startCamBtn" onclick="startCamera()">📷 開啟鏡頭</button>
        <button id="captureBtn" onclick="freezeImage()" disabled class="orange">📸 定格畫面</button>
        <button id="retakeBtn" onclick="unfreezeImage()" style="display:none;" class="red">🔄 重拍/取消定格</button>
        <button id="ocrBtn" onclick="runOCR()" style="display:none;" class="green">🔍 辨識框內品號</button>
        <button id="clearBoxBtn" onclick="resetBox()" style="display:none;" class="gray">清空框</button>
    </div>

    <div id="status">請點擊「開啟鏡頭」</div>

    <!-- 結果選單 -->
    <div id="resultPanel">
        <h3 style="margin-top:0;">確認品號</h3>
        <div id="results"></div>
        <p style="margin:5px 0; font-size:12px; color:#666;">可點選上方建議或在此手動修改：</p>
        <input id="manualCode" placeholder="請輸入品號">
        <button onclick="confirmCode()" class="green" style="width:100%; font-size:18px;">確認品號 ➔ 下一步</button>
    </div>

    <!-- 第二階段：1000x905 產品拍照與定格區域 -->
    <div id="productBox" class="product-area" style="display:none">
        <video id="productVideo" class="layer" autoplay playsinline muted></video>
        <canvas id="productFreezeCanvas" class="layer" width="1000" height="905"></canvas>
    </div>

    <div>
        <button id="takeProductBtn" style="display:none" class="green" onclick="takeProductPhoto()">📸 拍產品圖</button>
        <button id="retakeProductBtn" style="display:none" class="orange" onclick="retakeProductPhoto()">🔄 重拍</button>
        <button id="saveBtn" style="display:none" class="green" onclick="saveImage()">💾 確認存檔</button>
    </div>

    <canvas id="rawSnapshotCanvas" width="3000" height="2000" style="display:none;"></canvas>
    <canvas id="productCanvas" width="1000" height="905" style="display:none;"></canvas>

    <script>
        const video = document.getElementById("video");
        const freezeCanvas = document.getElementById("freezeCanvas");
        const freezeCtx = freezeCanvas.getContext("2d");

        const rawSnapshotCanvas = document.getElementById("rawSnapshotCanvas");
        const rawSnapshotCtx = rawSnapshotCanvas.getContext("2d");

        const boxCanvas = document.getElementById("boxCanvas");
        const boxCtx = boxCanvas.getContext("2d");

        const status = document.getElementById("status");
        const startCamBtn = document.getElementById("startCamBtn");
        const captureBtn = document.getElementById("captureBtn");
        const retakeBtn = document.getElementById("retakeBtn");
        const ocrBtn = document.getElementById("ocrBtn");
        const clearBoxBtn = document.getElementById("clearBoxBtn");
        const transformBar = document.getElementById("transformBar");
        const rotateSlider = document.getElementById("rotateSlider");
        const degVal = document.getElementById("degVal");

        let activeStream = null;
        let freezeDone = false;
        let selectedBox = null;
        let confirmedCode = "";
        let barcodeDetector = null;

        // 圖片變換矩陣狀態
        let imgRotation = 0;
        let imgScale = 1.0;
        let imgOffsetX = 0;
        let imgOffsetY = 0;

        // 手勢操控變數
        let isDragBox = false;
        let isResizeBox = false;
        let isDragImage = false;
        let touchStartPos = { x: 0, y: 0 };
        let boxDragOffset = { x: 0, y: 0 };
        
        let initialPinchDist = 0;
        let initialPinchAngle = 0;
        let initialScale = 1.0;
        let initialRotation = 0;

        if ('BarcodeDetector' in window) {
            try {
                barcodeDetector = new BarcodeDetector({
                    formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'upc_a']
                });
            } catch (e) { barcodeDetector = new BarcodeDetector(); }
        }

        function stopCurrentStream() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
        }

        async function startCamera() {
            stopCurrentStream();
            status.innerHTML = "正在啟動高畫質鏡頭...";
            
            const constraintsList = [
                { video: { facingMode: { exact: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false },
                { video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
                { video: true, audio: false }
            ];

            for (let constraints of constraintsList) {
                try {
                    activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = activeStream;
                    await video.play();
                    captureBtn.disabled = false;
                    startCamBtn.style.display = "none";
                    status.innerHTML = "請對準品號後按下「📸 定格畫面」";
                    return;
                } catch (e) { console.log("Camera constraints fallback...", e); }
            }

            alert("無法開啟鏡頭，請確認權限並使用 HTTPS 網址！");
            status.innerHTML = "無法開啟鏡頭！";
        }

        function freezeImage() {
            const vw = video.videoWidth || 3000;
            const vh = video.videoHeight || 2000;
            const targetRatio = 3000 / 2000;
            const videoRatio = vw / vh;

            let sx, sy, sw, sh;
            if (videoRatio > targetRatio) {
                sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
            } else {
                sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
            }

            rawSnapshotCtx.clearRect(0, 0, 3000, 2000);
            rawSnapshotCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 3000, 2000);

            resetImageTransform();

            freezeCanvas.style.display = "block";
            freezeDone = true;

            captureBtn.style.display = "none";
            retakeBtn.style.display = "inline-block";
            ocrBtn.style.display = "inline-block";
            clearBoxBtn.style.display = "inline-block";
            transformBar.style.display = "block";

            status.innerHTML = "畫面已定格！在畫面上用「單指拖曳」移動照片、「雙指旋轉/縮放」，摸綠框調整綠框";
            createDefaultBox();
        }

        // 以「取景視窗中心點 (1500, 1000)」為唯一固定旋轉與縮放軸心
        function renderTransformedImage() {
            freezeCtx.clearRect(0, 0, 3000, 2000);
            freezeCtx.save();

            // 1. 先將畫布座標原點平移至「視窗中心 (1500, 1000)」
            freezeCtx.translate(1500, 1000);
            // 2. 以視窗中心進行旋轉
            freezeCtx.rotate((imgRotation * Math.PI) / 180);
            // 3. 以視窗中心進行縮放
            freezeCtx.scale(imgScale, imgScale);
            // 4. 帶入照片自身的位移偏移量
            freezeCtx.translate(-1500 + imgOffsetX, -1000 + imgOffsetY);

            freezeCtx.drawImage(rawSnapshotCanvas, 0, 0);
            freezeCtx.restore();

            updateZoom();
        }

        function onRotateSliderChange(val) {
            imgRotation = parseInt(val);
            degVal.innerText = imgRotation + "°";
            renderTransformedImage();
        }

        function stepRotate(deg) {
            imgRotation = (imgRotation + deg) % 360;
            if (imgRotation > 180) imgRotation -= 360;
            if (imgRotation < -180) imgRotation += 360;

            rotateSlider.value = imgRotation;
            degVal.innerText = imgRotation + "°";
            renderTransformedImage();
        }

        function resetImageTransform() {
            imgRotation = 0;
            imgScale = 1.0;
            imgOffsetX = 0;
            imgOffsetY = 0;
            rotateSlider.value = 0;
            degVal.innerText = "0°";
            renderTransformedImage();
        }

        function unfreezeImage() {
            freezeCanvas.style.display = "none";
            freezeDone = false;

            resetBox();

            captureBtn.style.display = "inline-block";
            retakeBtn.style.display = "none";
            ocrBtn.style.display = "none";
            clearBoxBtn.style.display = "none";
            transformBar.style.display = "none";
            document.getElementById("resultPanel").style.display = "none";

            status.innerHTML = "已恢復即時畫面，請重新對準品號定格";
        }

        function createDefaultBox() {
            selectedBox = { x: 750, y: 800, w: 1500, h: 400 };
            redrawBox();
            updateZoom();
        }

        function resetBox() {
            boxCtx.clearRect(0, 0, 3000, 2000);
            selectedBox = null;
            updateZoom();
        }

        function getCanvasPosition(e) {
            const rect = boxCanvas.getBoundingClientRect();
            let touch = e.touches ? e.touches[0] : e;
            return {
                x: Math.round((touch.clientX - rect.left) * (3000 / rect.width)),
                y: Math.round((touch.clientY - rect.top) * (2000 / rect.height))
            };
        }

        function insideBox(pos) {
            if (!selectedBox) return false;
            return (pos.x >= selectedBox.x && pos.x <= selectedBox.x + selectedBox.w &&
                    pos.y >= selectedBox.y && pos.y <= selectedBox.y + selectedBox.h);
        }

        function nearResizePoint(pos) {
            if (!selectedBox) return false;
            let rx = selectedBox.x + selectedBox.w;
            let ry = selectedBox.y + selectedBox.h;
            return Math.abs(pos.x - rx) < 150 && Math.abs(pos.y - ry) < 150;
        }

        function redrawBox() {
            boxCtx.clearRect(0, 0, 3000, 2000);
            if (!selectedBox) return;

            boxCtx.strokeStyle = "#00ff00";
            boxCtx.lineWidth = 12;
            boxCtx.strokeRect(selectedBox.x, selectedBox.y, selectedBox.w, selectedBox.h);

            boxCtx.fillStyle = "#00ff00";
            boxCtx.fillRect(selectedBox.x + selectedBox.w - 40, selectedBox.y + selectedBox.h - 40, 80, 80);
        }

        function handleStart(e) {
            if (!freezeDone) return;

            if (e.touches && e.touches.length === 2) {
                isDragBox = false;
                isResizeBox = false;
                isDragImage = false;

                initialPinchDist = getTouchDistance(e.touches);
                initialPinchAngle = getTouchAngle(e.touches);
                initialScale = imgScale;
                initialRotation = imgRotation;
                return;
            }

            let pos = getCanvasPosition(e);
            touchStartPos = pos;

            if (nearResizePoint(pos)) {
                isResizeBox = true;
            } else if (insideBox(pos)) {
                isDragBox = true;
                boxDragOffset.x = pos.x - selectedBox.x;
                boxDragOffset.y = pos.y - selectedBox.y;
            } else {
                isDragImage = true;
            }
        }

        function handleMove(e) {
            if (!freezeDone) return;

            if (e.touches && e.touches.length === 2) {
                let dist = getTouchDistance(e.touches);
                let angle = getTouchAngle(e.touches);

                if (initialPinchDist > 0) {
                    let scaleFactor = dist / initialPinchDist;
                    imgScale = Math.min(Math.max(0.4, initialScale * scaleFactor), 4.0);

                    let deltaAngle = angle - initialPinchAngle;
                    let newRot = Math.round(initialRotation + deltaAngle);
                    
                    while (newRot > 180) newRot -= 360;
                    while (newRot < -180) newRot += 360;

                    imgRotation = newRot;
                    rotateSlider.value = imgRotation;
                    degVal.innerText = imgRotation + "°";

                    renderTransformedImage();
                }
                return;
            }

            let pos = getCanvasPosition(e);

            if (isDragBox) {
                selectedBox.x = Math.max(0, Math.min(3000 - selectedBox.w, pos.x - boxDragOffset.x));
                selectedBox.y = Math.max(0, Math.min(2000 - selectedBox.h, pos.y - boxDragOffset.y));
                redrawBox();
                updateZoom();
            } else if (isResizeBox) {
                selectedBox.w = Math.max(160, pos.x - selectedBox.x);
                selectedBox.h = Math.max(80, pos.y - selectedBox.y);
                redrawBox();
                updateZoom();
            } else if (isDragImage) {
                let dx = pos.x - touchStartPos.x;
                let dy = pos.y - touchStartPos.y;

                let rad = -(imgRotation * Math.PI) / 180;
                let unrotatedDx = (dx * Math.cos(rad) - dy * Math.sin(rad)) / imgScale;
                let unrotatedDy = (dx * Math.sin(rad) + dy * Math.cos(rad)) / imgScale;

                imgOffsetX += unrotatedDx;
                imgOffsetY += unrotatedDy;
                touchStartPos = pos;

                renderTransformedImage();
            }
        }

        function handleEnd() {
            isDragBox = false;
            isResizeBox = false;
            isDragImage = false;
            initialPinchDist = 0;
        }

        function getTouchDistance(touches) {
            let dx = touches[0].clientX - touches[1].clientX;
            let dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getTouchAngle(touches) {
            let dx = touches[1].clientX - touches[0].clientX;
            let dy = touches[1].clientY - touches[0].clientY;
            return Math.atan2(dy, dx) * (180 / Math.PI);
        }

        boxCanvas.addEventListener("mousedown", handleStart);
        boxCanvas.addEventListener("mousemove", handleMove);
        boxCanvas.addEventListener("mouseup", handleEnd);

        boxCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
        boxCanvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        boxCanvas.addEventListener("touchend", handleEnd);

        const zoomBox = document.getElementById("zoomBox");
        const zoomCanvas = document.getElementById("zoomCanvas");
        const zoomCtx = zoomCanvas.getContext("2d");

        function updateZoom() {
            if (!selectedBox || !freezeDone) {
                zoomBox.style.display = "none";
                return;
            }
            zoomBox.style.display = "block";
            zoomCtx.clearRect(0, 0, 600, 240);
            zoomCtx.drawImage(
                freezeCanvas, 
                selectedBox.x, selectedBox.y, selectedBox.w, selectedBox.h, 
                0, 0, 600, 240
            );
        }

        function getCropCanvas(preprocess = false) {
            if (!selectedBox) return null;
            let scale = 1.5;
            let crop = document.createElement("canvas");
            crop.width = selectedBox.w * scale;
            crop.height = selectedBox.h * scale;
            let ctx = crop.getContext("2d");
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            ctx.drawImage(
                freezeCanvas, 
                selectedBox.x, selectedBox.y, selectedBox.w, selectedBox.h, 
                0, 0, crop.width, crop.height
            );

            if (preprocess) {
                preprocessCropImage(crop);
            }
            return crop;
        }

        function preprocessCropImage(canvas) {
            const ctx = canvas.getContext("2d");
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let totalBrightness = 0;
            const pixelCount = data.length / 4;
            for (let i = 0; i < data.length; i += 4) {
                totalBrightness += (data[i] + data[i + 1] + data[i + 2]) / 3;
            }

            const avgBrightness = totalBrightness / pixelCount;
            const isDark = avgBrightness < 120;

            for (let i = 0; i < data.length; i += 4) {
                let brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                let value = isDark ? (brightness > 110 ? 0 : 255) : (brightness < 140 ? 0 : 255);
                data[i] = data[i + 1] = data[i + 2] = value;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        let ocrCandidates = [];

        async function runOCR() {
            if (!selectedBox) { alert("請先劃定品號區域！"); return; }

            status.innerHTML = "正在分析品號...";
            ocrCandidates = [];

            let rawCrop = getCropCanvas(false);
            let processedCrop = getCropCanvas(true);

            if (barcodeDetector) {
                try {
                    const barcodes = await barcodeDetector.detect(rawCrop);
                    barcodes.forEach(b => {
                        let val = b.rawValue ? b.rawValue.trim().toUpperCase() : "";
                        if (val && !ocrCandidates.find(c => c.code === val)) {
                            ocrCandidates.push({ code: val, isBarcode: true });
                        }
                    });
                } catch (e) { console.log(e); }
            }

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/*',
                    tessedit_pageseg_mode: '7',
                    load_system_dawg: '0', load_freq_dawg: '0'
                });

                const resRaw = await worker.recognize(rawCrop);
                let cleanRaw = resRaw.data.text.trim().replace(/[^A-Za-z0-9\-*/]/g, '').toUpperCase();
                if (cleanRaw && cleanRaw.length >= 3) {
                    ocrCandidates.push({ code: cleanRaw, isBarcode: false });
                }

                const resProcessed = await worker.recognize(processedCrop);
                let cleanProc = resProcessed.data.text.trim().replace(/[^A-Za-z0-9\-*/]/g, '').toUpperCase();
                if (cleanProc && cleanProc.length >= 3 && !ocrCandidates.find(c => c.code === cleanProc)) {
                    ocrCandidates.push({ code: cleanProc, isBarcode: false });
                }

                await worker.terminate();

                if (cleanRaw) generateSimilarCandidates(cleanRaw);

            } catch (e) {
                status.innerHTML = "OCR 辨識錯誤：" + e.message;
            }

            showOCRResults();
        }

        function generateSimilarCandidates(code) {
            let list = [];
            if (code.includes("0")) list.push(code.replace(/0/g, "O"));
            if (code.includes("O")) list.push(code.replace(/O/g, "0"));
            if (code.includes("1")) list.push(code.replace(/1/g, "I"));
            if (code.includes("I")) list.push(code.replace(/I/g, "1"));

            list.forEach(x => {
                if (!ocrCandidates.find(y => y.code === x)) {
                    ocrCandidates.push({ code: x, isBarcode: false });
                }
            });
        }

        function showOCRResults() {
            let panel = document.getElementById("resultPanel");
            let results = document.getElementById("results");
            results.innerHTML = "";

            if (ocrCandidates.length === 0) {
                status.innerHTML = "未辨識出有效字元，請手動輸入品號：";
            } else {
                status.innerHTML = "辨識完成，請點選正確品號：";
                ocrCandidates.forEach((item, index) => {
                    let div = document.createElement("div");
                    div.className = "result-item";
                    if (index === 0) div.classList.add("selected");

                    let tag = item.isBarcode ? " <span style='color:red;'>[條碼]</span>" : "";
                    div.innerHTML = `${formatDisplayCode(item.code)}${tag}`;

                    div.onclick = function () {
                        document.querySelectorAll('.result-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        document.getElementById("manualCode").value = formatDisplayCode(item.code);
                    };
                    results.appendChild(div);
                });
                document.getElementById("manualCode").value = formatDisplayCode(ocrCandidates[0].code);
            }
            panel.style.display = "block";
        }

        function formatDisplayCode(str) {
            return str.replace(/\*/g, "＊").replace(/\//g, "／");
        }

        function confirmCode() {
            let code = document.getElementById("manualCode").value.trim();
            if (!code) { alert("請輸入品號！"); return; }

            confirmedCode = code;

            document.getElementById("resultPanel").style.display = "none";
            document.getElementById("cameraBox").style.display = "none";
            document.getElementById("zoomBox").style.display = "none";
            transformBar.style.display = "none";

            document.getElementById("productBox").style.display = "block";
            document.getElementById("takeProductBtn").style.display = "inline-block";
            document.getElementById("retakeProductBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "none";

            document.getElementById("stepTitle").innerHTML = "第二階段：拍攝產品圖 (品號：" + confirmedCode + ")";
            status.innerHTML = "請對準產品，按「📸 拍產品圖」";

            openProductCamera();
        }

        const productVideo = document.getElementById("productVideo");
        const productCanvas = document.getElementById("productCanvas");
        const productCtx = productCanvas.getContext("2d");
        const productFreezeCanvas = document.getElementById("productFreezeCanvas");
        const productFreezeCtx = productFreezeCanvas.getContext("2d");

        async function openProductCamera() {
            stopCurrentStream();
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                productVideo.srcObject = activeStream;
                await productVideo.play();
                retakeProductPhoto();
            } catch (e) { alert("產品鏡頭錯誤：" + e.message); }
        }

        function takeProductPhoto() {
            const targetW = 1000; const targetH = 905;
            const vw = productVideo.videoWidth || 1920;
            const vh = productVideo.videoHeight || 1080;

            const targetRatio = targetW / targetH;
            const videoRatio = vw / vh;
            let sx, sy, sw, sh;

            if (videoRatio > targetRatio) {
                sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
            } else {
                sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
            }

            productCanvas.width = targetW; productCanvas.height = targetH;
            productCtx.clearRect(0, 0, targetW, targetH);
            productCtx.drawImage(productVideo, sx, sy, sw, sh, 0, 0, targetW, targetH);

            productFreezeCtx.clearRect(0, 0, targetW, targetH);
            productFreezeCtx.drawImage(productCanvas, 0, 0);
            productFreezeCanvas.style.display = "block";

            document.getElementById("takeProductBtn").style.display = "none";
            document.getElementById("retakeProductBtn").style.display = "inline-block";
            document.getElementById("saveBtn").style.display = "inline-block";

            status.innerHTML = "照片已定格！請選擇「💾 確認存檔」或「🔄 重拍」";
        }

        function retakeProductPhoto() {
            productFreezeCtx.clearRect(0, 0, 1000, 905);
            productFreezeCanvas.style.display = "none";

            document.getElementById("takeProductBtn").style.display = "inline-block";
            document.getElementById("retakeProductBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "none";

            status.innerHTML = "請對準產品，按下「📸 拍產品圖」";
        }

        // 輔助函式：將 Uint8Array 的 JPEG 檔寫入 72 DPI 標記
        function applyJpegDpiToBuffer(buffer, dpi = 72) {
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.length - 9; i++) {
                if (bytes[i] === 0xFF && bytes[i + 1] === 0xE0) {
                    bytes[i + 11] = 1;
                    bytes[i + 12] = (dpi >> 8) & 255;
                    bytes[i + 13] = dpi & 255;
                    bytes[i + 14] = (dpi >> 8) & 255;
                    bytes[i + 15] = dpi & 255;
                    break;
                }
            }
            return bytes;
        }

        // 全平台相容的存檔函式 (iOS / Android / PDA)
        async function saveImage() {
            status.innerHTML = "正在處理照片存檔...";
            let filename = (confirmedCode || "photo") + ".jpg";

            productCanvas.toBlob(async (blob) => {
                if (!blob) {
                    alert("照片產生失敗，請重試！");
                    return;
                }

                // 寫入 72 DPI 標記
                const arrayBuffer = await blob.arrayBuffer();
                const dpiBytes = applyJpegDpiToBuffer(arrayBuffer, 72);
                const finalBlob = new Blob([dpiBytes], { type: "image/jpeg" });
                const file = new File([finalBlob], filename, { type: "image/jpeg" });

                // 1. 優先方案：使用 Web Share API (適用 iPhone Safari 與新版 Android)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: '品號照片存檔',
                        });
                        resetSystem();
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            status.innerHTML = "已取消儲存";
                            return;
                        }
                        console.log("Web Share 失敗，切換至傳統下載備案:", err);
                    }
                }

                // 2. 備案：Blob URL 下載 (適用 PM85 PDA、一般 Android Chrome 與電腦版)
                const blobUrl = URL.createObjectURL(finalBlob);
                const link = document.createElement("a");
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
                alert("已觸發存檔：" + filename);
                resetSystem();

            }, "image/jpeg", 0.90);
        }

        function resetSystem() {
            confirmedCode = "";
            unfreezeImage();
            retakeProductPhoto();

            document.getElementById("productBox").style.display = "none";
            document.getElementById("takeProductBtn").style.display = "none";
            document.getElementById("retakeProductBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "none";

            document.getElementById("cameraBox").style.display = "block";
            document.getElementById("stepTitle").innerHTML = "第一階段：品號辨識";

            startCamera();
        }
    </script>
</body>
</html>
