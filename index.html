<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門市品號辨識系統</title>
    <!-- 載入 Tesseract.js OCR 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f5f5f5;
        }
        
        .step-badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 階段 1 取景框：1200x800 比例 (3:2 比例，支援手機寬度自適應) */
        .camera-container-step1 {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 1200 / 800;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 3px solid #ff9800; /* 橘框代表辨識模式 */
            border-radius: 8px;
            background-color: #000;
        }

        /* 階段 2 取景框：284x257 比例 */
        .camera-container-step2 {
            width: 284px;
            height: 257px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 3px solid #28a745; /* 綠框代表產品拍照模式 */
            border-radius: 8px;
            background-color: #000;
        }

        .webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 定格預覽圖 (蓋在 Video 上) */
        #freezePreview {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 10;
        }

        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            margin: 5px; 
            cursor: pointer; 
            border-radius: 5px;
            border: none;
            background-color: #007bff;
            color: white;
        }
        button:disabled { background-color: #ccc; }
        .btn-green { background-color: #28a745; }
        .btn-orange { background-color: #ff9800; }
        
        #status { font-weight: bold; margin: 10px; color: #333; }
        
        #selectionPanel {
            display: none;
            max-width: 320px;
            margin: 15px auto;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: left;
            color: #333;
            font-size: 15px;
            font-weight: bold;
        }
        .option-item:hover, .option-item:active { 
            background: #e2e6ea; 
            border-color: #007bff;
        }
        .custom-input-group {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }
        .custom-input-group input {
            width: calc(100% - 22px);
            padding: 10px;
            font-size: 16px;
            margin-bottom: 8px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #ocrCanvas, #productCanvas { display: none; }
    </style>
</head>
<body>

    <h2>門市產品辨識系統</h2>
    <div id="stepBadge" class="step-badge">第一階段：拍攝並辨識品號 (1200x800 視窗)</div>

    <!-- 視訊取景容器 -->
    <div id="cameraBox" class="camera-container-step1">
        <video id="webcam" class="webcam-video" autoplay playsinline></video>
        <!-- 拍攝定格用的 Canvas -->
        <canvas id="freezePreview" width="284" height="257"></canvas>
    </div>
    
    <div>
        <button id="startBtn" onclick="initCamera()">📷 開啟鏡頭</button>
        <!-- 階段 1 按鈕 -->
        <button id="captureOCRBtn" onclick="captureAndRecognize()" disabled>🔍 1. 擷取品號</button>
        
        <!-- 階段 2 按鈕群 -->
        <button id="captureProductBtn" class="btn-green" onclick="shootProductImage()" style="display:none;">📸 2. 拍產品圖</button>
        <button id="retakeBtn" class="btn-orange" onclick="resetToStep2Camera()" style="display:none;">🔄 重拍</button>
        <button id="saveBtn" class="btn-green" onclick="confirmSaveAndReset()" style="display:none;">💾 確認存檔</button>
    </div>
    
    <div id="status">請點擊「開啟鏡頭」</div>

    <!-- 第一階段：辨識結果微調面板 -->
    <div id="selectionPanel">
        <p style="margin-top:0; font-weight:bold; color:#007bff;">請點選可能品號帶入下方：</p>
        <div id="optionsContainer"></div>
        
        <div class="custom-input-group">
            <p style="margin:5px 0; font-size:14px; font-weight:bold; color:#333;">確認/微調品號：</p>
            <input type="text" id="manualInput" placeholder="請點選上方選項或在此輸入...">
            <button style="width:100%; font-size:16px; font-weight:bold; padding:12px;" onclick="confirmCodeAndGoToStep2()">下一步：拍攝產品圖 ➔</button>
        </div>
    </div>

    <!-- 輔助繪圖 Canvas -->
    <canvas id="ocrCanvas"></canvas>
    <canvas id="productCanvas" width="284" height="257"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const cameraBox = document.getElementById('cameraBox');
        const stepBadge = document.getElementById('stepBadge');
        const statusDiv = document.getElementById('status');
        const freezePreview = document.getElementById('freezePreview');
        const freezeCtx = freezePreview.getContext('2d');
        
        const captureOCRBtn = document.getElementById('captureOCRBtn');
        const captureProductBtn = document.getElementById('captureProductBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const saveBtn = document.getElementById('saveBtn');
        
        const selectionPanel = document.getElementById('selectionPanel');
        const optionsContainer = document.getElementById('optionsContainer');
        const manualInput = document.getElementById('manualInput');

        const ocrCanvas = document.getElementById('ocrCanvas');
        const productCanvas = document.getElementById('productCanvas');
        const ocrCtx = ocrCanvas.getContext('2d');
        const productCtx = productCanvas.getContext('2d');

        let confirmedFileName = "";
        let capturedBase64Data = "";

        // 1. 初始化鏡頭
        async function initCamera() {
            statusDiv.innerText = "正在啟動鏡頭...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                captureOCRBtn.disabled = false;
                statusDiv.innerText = "請將品號對準 1200x800 橘色視窗，點擊「擷取品號」";
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    video.srcObject = fallbackStream;
                    captureOCRBtn.disabled = false;
                    statusDiv.innerText = "已啟用鏡頭，請對準視窗";
                } catch (e) {
                    statusDiv.innerText = "無法開啟鏡頭：" + e.message;
                    alert("鏡頭開啟失敗！請檢查是否使用 https:// 網址及相機權限。\n錯誤訊息：" + e.message);
                }
            }
        }

        // 2. 第一階段：精確橘框裁切 (1200:800) + 智慧黑白反相處理 AI 辨識
        async function captureAndRecognize() {
            selectionPanel.style.display = "none";
            optionsContainer.innerHTML = "";
            manualInput.value = "";
            statusDiv.innerText = "正在讀取橘框影像並優化黑白對比...";

            const vWidth = video.videoWidth || 1920;
            const vHeight = video.videoHeight || 1080;

            // 計算 1200:800 (1.5) 橘框在影像中的精確裁切範圍
            const boxAspect = 1200 / 800;
            const videoAspect = vWidth / vHeight;

            let cropW, cropH, cropX, cropY;
            if (videoAspect > boxAspect) {
                cropH = vHeight;
                cropW = vHeight * boxAspect;
                cropX = (vWidth - cropW) / 2;
                cropY = 0;
            } else {
                cropW = vWidth;
                cropH = vWidth / boxAspect;
                cropX = 0;
                cropY = (vHeight - cropH) / 2;
            }

            ocrCanvas.width = cropW;
            ocrCanvas.height = cropH;
            ocrCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            preprocessImageForOCR(ocrCtx, cropW, cropH);

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/*',
                    tessedit_pageseg_mode: '6',
                });

                const { data: { lines } } = await worker.recognize(ocrCanvas);
                await worker.terminate();

                let candidates = [];
                lines.forEach(line => {
                    let clean = line.text.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
                    if (clean.length >= 3 && /[A-Z0-9]/.test(clean) && !candidates.includes(clean)) {
                        candidates.push(clean);
                    }
                });

                if (candidates.length === 0) {
                    statusDiv.innerText = "未辨識出有效品號，請手動輸入：";
                    showSelectionPanel([]);
                    return;
                }

                statusDiv.innerText = `辨識完成！請點選或微調品號：`;
                showSelectionPanel(candidates);

            } catch (err) {
                statusDiv.innerText = "辨識發生錯誤：" + err.message;
            }
        }

        // 智慧二值化預處理（自動判斷黑白底並修正為白底黑字）
        function preprocessImageForOCR(ctx, width, height) {
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            
            let totalBrightness = 0;
            const pixelCount = data.length / 4;
            
            for (let i = 0; i < data.length; i += 4) {
                let brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                totalBrightness += brightness;
            }
            
            const avgBrightness = totalBrightness / pixelCount;
            const isDarkBackground = avgBrightness < 128;

            for (let i = 0; i < data.length; i += 4) {
                let brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                
                let value;
                if (isDarkBackground) {
                    value = brightness > 100 ? 0 : 255;
                } else {
                    value = brightness < 140 ? 0 : 255;
                }

                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
            }
            
            ctx.putImageData(imgData, 0, 0);
        }

        // 3. 顯示選項面板
        function showSelectionPanel(candidates) {
            optionsContainer.innerHTML = "";
            candidates.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = text;
                btn.onclick = () => {
                    manualInput.value = text;
                    manualInput.focus();
                };
                optionsContainer.appendChild(btn);
            });

            if (candidates.length > 0) {
                manualInput.value = candidates[0];
            }
            selectionPanel.style.display = "block";
        }

        // 4. 確認品號並切換至第二階段
        function confirmCodeAndGoToStep2() {
            const rawText = manualInput.value.trim();
            if (!rawText) {
                alert("請輸入品號！");
                return;
            }

            let cleanText = rawText.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
            
            const needsFullWidth = /[*\/]/.test(cleanText);
            confirmedFileName = needsFullWidth ? toFullWidth(cleanText) : cleanText;

            selectionPanel.style.display = "none";
            captureOCRBtn.style.display = "none";
            
            cameraBox.className = "camera-container-step2";
            stepBadge.innerText = `第二階段：拍攝產品圖 (品號：${confirmedFileName})`;
            stepBadge.style.backgroundColor = "#28a745";
            
            resetToStep2Camera();
            statusDiv.innerText = `品號定案：[ ${confirmedFileName} ]！請對準綠框，點擊「拍產品圖」`;
        }

        // 重置為第二階段即時畫面狀態
        function resetToStep2Camera() {
            freezeCtx.clearRect(0, 0, freezePreview.width, freezePreview.height);
            freezePreview.style.display = "none";
            captureProductBtn.style.display = "inline-block";
            retakeBtn.style.display = "none";
            saveBtn.style.display = "none";
            statusDiv.innerText = `請對準綠框，按下「📸 2. 拍產品圖」`;
        }

        // 5. 第二階段：拍產品圖
        function shootProductImage() {
            const targetWidth = 284;
            const targetHeight = 257;
            const videoWidth = video.videoWidth || 1280;
            const videoHeight = video.videoHeight || 720;

            const targetAspect = targetWidth / targetHeight; 
            const videoAspect = videoWidth / videoHeight;   

            let sx, sy, sWidth, sHeight;

            if (videoAspect > targetAspect) {
                sHeight = videoHeight;
                sWidth = videoHeight * targetAspect;
                sx = (videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = videoWidth;
                sHeight = videoWidth / targetAspect;
                sx = 0;
                sy = (videoHeight - sHeight) / 2;
            }

            productCtx.clearRect(0, 0, targetWidth, targetHeight);
            productCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);

            freezePreview.width = targetWidth;
            freezePreview.height = targetHeight;
            freezePreview.style.display = "block";
            freezeCtx.clearRect(0, 0, targetWidth, targetHeight);
            freezeCtx.drawImage(productCanvas, 0, 0);

            const rawDataURL = productCanvas.toDataURL('image/jpeg', 0.95);
            capturedBase64Data = setJpegDpi(rawDataURL, 72);

            captureProductBtn.style.display = "none";
            retakeBtn.style.display = "inline-block";
            saveBtn.style.display = "inline-block";

            statusDiv.innerText = "畫面已定格！確認無誤請按「確認存檔」，或按「重拍」";
        }

        // 6. 確認存檔並自動回到第一階段
        function confirmSaveAndReset() {
            if (!capturedBase64Data) return;

            downloadImageToMobile(capturedBase64Data, confirmedFileName + ".jpg");

            alert(`已下載：${confirmedFileName}.jpg！即將回到第一階段拍攝新品號。`);

            resetToStep1();
        }

        // 自動重置回到第一階段
        function resetToStep1() {
            confirmedFileName = "";
            capturedBase64Data = "";
            manualInput.value = "";

            freezeCtx.clearRect(0, 0, freezePreview.width, freezePreview.height);
            freezePreview.style.display = "none";
            
            captureProductBtn.style.display = "none";
            retakeBtn.style.display = "none";
            saveBtn.style.display = "none";
            selectionPanel.style.display = "none";

            cameraBox.className = "camera-container-step1";
            stepBadge.innerText = "第一階段：拍攝並辨識品號 (1200x800 視窗)";
            stepBadge.style.backgroundColor = "#007bff";
            captureOCRBtn.style.display = "inline-block";

            statusDiv.innerText = "已回到第一階段，請將下一個品號對準橘色視窗";
        }

        // 7. 下載圖片至手機
        function downloadImageToMobile(base64Data, fileName) {
            const link = document.createElement('a');
            link.href = base64Data;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 8. 全形轉換
        function toFullWidth(str) {
            return str.replace(/[\u0021-\u007E]/g, s => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));
        }

        // 9. 寫入 72 DPI Header
        function setJpegDpi(base64Image, dpi) {
            const byteString = atob(base64Image.split(',')[1]);
            const buffer = new Uint8Array(byteString.length);
            for (let i = 0; i < byteString.length; i++) {
                buffer[i] = byteString.charCodeAt(i);
            }

            if (buffer[0] === 0xFF && buffer[1] === 0xD8) {
                let offset = 2;
                while (offset < buffer.length) {
                    if (buffer[offset] === 0xFF && buffer[offset + 1] === 0xE0) {
                        buffer[offset + 11] = 1;
                        buffer[offset + 12] = (dpi >> 8) & 0xFF;
                        buffer[offset + 13] = dpi & 0xFF;
                        buffer[offset + 14] = (dpi >> 8) & 0xFF;
                        buffer[offset + 15] = dpi & 0xFF;
                        break;
                    }
                    offset += 1 + buffer[offset + 2];
                }
            }

            let binary = '';
            for (let i = 0; i < buffer.byteLength; i++) {
                binary += String.fromCharCode(buffer[i]);
            }
            return 'data:image/jpeg;base64,' + btoa(binary);
        }
    </script>
</body>
</html>
