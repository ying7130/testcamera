<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>門市品號辨識系統 V2.1</title>
    <!-- 載入 Tesseract.js OCR 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            margin: 0;
        }

        h2 { margin: 10px 0; font-size: 20px; }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: #007bff;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 1200x800 取景與劃框容器 */
        .camera-area {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 1200 / 800;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #ff9800;
            border-radius: 8px;
            touch-action: none; /* 防止手機拖曳網頁 */
        }

        /* 284x257 產品拍照容器 */
        .product-area {
            width: 284px;
            height: 257px;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #28a745;
            border-radius: 8px;
        }

        video, canvas.layer {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            object-fit: cover;
        }

        #freezeCanvas { z-index: 2; display: none; }
        #boxCanvas { z-index: 5; }

        /* 放大鏡 */
        #zoomBox {
            display: none;
            width: 300px;
            height: 120px;
            margin: 10px auto;
            border: 2px solid #333;
            background: white;
            overflow: hidden;
        }

        #zoomCanvas { width: 100%; height: 100%; }

        button {
            padding: 10px 16px;
            margin: 4px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { background: #ccc; }
        .green { background: #28a745; }
        .orange { background: #ff9800; }
        .gray { background: #6c757d; }
        .red { background: #dc3545; }

        #status { font-weight: bold; margin: 10px; color: #333; font-size: 14px; }

        #resultPanel {
            max-width: 350px;
            margin: 10px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }

        .result-item {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            cursor: pointer;
            border-radius: 5px;
            text-align: left;
            font-weight: bold;
        }

        .result-item:active { background: #e2e6ea; border-color: #007bff; }
    </style>
</head>
<body>

    <h2>門市品號辨識系統 V2.1</h2>

    <div id="stepTitle" class="badge">第一階段：品號辨識</div>

    <!-- 取景區域 -->
    <div id="cameraBox" class="camera-area">
        <video id="video" autoplay playsinline></video>
        <canvas id="freezeCanvas" width="1200" height="800"></canvas>
        <canvas id="boxCanvas" class="layer" width="1200" height="800"></canvas>
    </div>

    <!-- 綠框放大預覽 -->
    <div id="zoomBox">
        <canvas id="zoomCanvas"></canvas>
    </div>

    <div>
        <button onclick="startCamera()">📷 開啟鏡頭</button>
        <button id="captureBtn" onclick="freezeImage()" disabled class="orange">📸 定格畫面</button>
        <button id="retakeBtn" onclick="unfreezeImage()" style="display:none;" class="red">🔄 重拍</button>
        <button id="ocrBtn" onclick="runOCR()" style="display:none;" class="green">🔍 辨識框內品號</button>
        <button id="clearBoxBtn" onclick="resetBox()" style="display:none;" class="gray">清空框</button>
    </div>

    <div id="status">請點擊「開啟鏡頭」</div>

    <!-- 結果選單 -->
    <div id="resultPanel">
        <h3 style="margin-top:0;">確認品號</h3>
        <div id="results"></div>
        <p style="margin:5px 0; font-size:12px; color:#666;">可點選上方建議或在此手動修改：</p>
        <input id="manualCode" placeholder="請輸入品號">
        <button onclick="confirmCode()" class="green" style="width:100%; font-size:18px;">確認品號 ➔ 下一步</button>
    </div>

    <!-- 第二階段產品拍照 -->
    <div id="productBox" class="product-area" style="display:none">
        <video id="productVideo" autoplay playsinline></video>
        <canvas id="productCanvas" width="284" height="257"></canvas>
    </div>

    <button id="takeProductBtn" style="display:none" class="green" onclick="takeProductPhoto()">📸 拍產品圖</button>
    <button id="saveBtn" style="display:none" class="green" onclick="saveImage()">💾 確認存檔</button>

    <script>
        const video = document.getElementById("video");
        const freezeCanvas = document.getElementById("freezeCanvas");
        const freezeCtx = freezeCanvas.getContext("2d");

        const boxCanvas = document.getElementById("boxCanvas");
        const boxCtx = boxCanvas.getContext("2d");

        const status = document.getElementById("status");
        const captureBtn = document.getElementById("captureBtn");
        const retakeBtn = document.getElementById("retakeBtn");
        const ocrBtn = document.getElementById("ocrBtn");
        const clearBoxBtn = document.getElementById("clearBoxBtn");

        let stream = null;
        let freezeDone = false;
        let selectedBox = null;
        let confirmedCode = "";
        let barcodeDetector = null;

        if ('BarcodeDetector' in window) {
            try {
                barcodeDetector = new BarcodeDetector({
                    formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'upc_a']
                });
            } catch (e) { barcodeDetector = new BarcodeDetector(); }
        }

        // 1. 啟動相機
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
                captureBtn.disabled = false;
                status.innerHTML = "對準品號後按下「📸 定格畫面」";
            } catch (e) {
                alert("無法開啟鏡頭：" + e.message);
            }
        }

        // 2. 定格畫面 (等比例裁切繪製至 1200x800 Canvas)
        function freezeImage() {
            const vw = video.videoWidth || 1920;
            const vh = video.videoHeight || 1080;
            const targetRatio = 1200 / 800;
            const videoRatio = vw / vh;

            let sx, sy, sw, sh;
            if (videoRatio > targetRatio) {
                sh = vh; sw = vh * targetRatio;
                sx = (vw - sw) / 2; sy = 0;
            } else {
                sw = vw; sh = vw / targetRatio;
                sx = 0; sy = (vh - sh) / 2;
            }

            freezeCtx.clearRect(0, 0, 1200, 800);
            freezeCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 1200, 800);

            freezeCanvas.style.display = "block";
            freezeDone = true;

            captureBtn.style.display = "none";
            retakeBtn.style.display = "inline-block";
            ocrBtn.style.display = "inline-block";
            clearBoxBtn.style.display = "inline-block";

            status.innerHTML = "畫面已定格！請用手指在畫面上劃出或拖曳綠框框選品號";
            createDefaultBox();
        }

        // 解除定格（重拍）
        function unfreezeImage() {
            freezeCanvas.style.display = "none";
            freezeDone = false;

            resetBox();

            captureBtn.style.display = "inline-block";
            retakeBtn.style.display = "none";
            ocrBtn.style.display = "none";
            clearBoxBtn.style.display = "none";
            document.getElementById("resultPanel").style.display = "none";

            status.innerHTML = "已恢復即時畫面，請重新對準品號定格";
        }

        function createDefaultBox() {
            selectedBox = { x: 300, y: 320, w: 600, h: 160 };
            redrawBox();
            updateZoom();
        }

        function resetBox() {
            boxCtx.clearRect(0, 0, 1200, 800);
            selectedBox = null;
            updateZoom();
        }

        // ===============================
        // 畫框、拖曳、縮放與座標轉換
        // ===============================
        function getCanvasPosition(e) {
            const rect = boxCanvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * (1200 / rect.width),
                y: (clientY - rect.top) * (800 / rect.height)
            };
        }

        function insideBox(pos) {
            if (!selectedBox) return false;
            return (pos.x >= selectedBox.x && pos.x <= selectedBox.x + selectedBox.w &&
                    pos.y >= selectedBox.y && pos.y <= selectedBox.y + selectedBox.h);
        }

        function nearResizePoint(pos) {
            if (!selectedBox) return false;
            let rx = selectedBox.x + selectedBox.w;
            let ry = selectedBox.y + selectedBox.h;
            return Math.abs(pos.x - rx) < 60 && Math.abs(pos.y - ry) < 60;
        }

        let dragging = false;
        let resizing = false;
        let dragOffset = { x: 0, y: 0 };
        let startPos = null;

        function redrawBox() {
            boxCtx.clearRect(0, 0, 1200, 800);
            if (!selectedBox) return;

            // 畫框
            boxCtx.strokeStyle = "#00ff00";
            boxCtx.lineWidth = 6;
            boxCtx.strokeRect(selectedBox.x, selectedBox.y, selectedBox.w, selectedBox.h);

            // 右下角控制小點
            boxCtx.fillStyle = "#00ff00";
            boxCtx.fillRect(selectedBox.x + selectedBox.w - 20, selectedBox.y + selectedBox.h - 20, 40, 40);
        }

        function handleStart(e) {
            if (!freezeDone) return;
            let pos = getCanvasPosition(e);
            startPos = pos;

            if (nearResizePoint(pos)) {
                resizing = true;
            } else if (insideBox(pos)) {
                dragging = true;
                dragOffset.x = pos.x - selectedBox.x;
                dragOffset.y = pos.y - selectedBox.y;
            } else {
                // 點擊空白處，重新拉一個框
                selectedBox = { x: pos.x, y: pos.y, w: 10, h: 10 };
                resizing = true;
            }
        }

        function handleMove(e) {
            if (!freezeDone || !selectedBox) return;
            let pos = getCanvasPosition(e);

            if (dragging) {
                selectedBox.x = Math.max(0, Math.min(1200 - selectedBox.w, pos.x - dragOffset.x));
                selectedBox.y = Math.max(0, Math.min(800 - selectedBox.h, pos.y - dragOffset.y));
                redrawBox();
                updateZoom();
            } else if (resizing) {
                selectedBox.w = Math.max(80, pos.x - selectedBox.x);
                selectedBox.h = Math.max(40, pos.y - selectedBox.y);
                redrawBox();
                updateZoom();
            }
        }

        function handleEnd() {
            dragging = false;
            resizing = false;
        }

        boxCanvas.addEventListener("mousedown", handleStart);
        boxCanvas.addEventListener("mousemove", handleMove);
        boxCanvas.addEventListener("mouseup", handleEnd);

        boxCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
        boxCanvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        boxCanvas.addEventListener("touchend", handleEnd);

        // 放大鏡
        const zoomBox = document.getElementById("zoomBox");
        const zoomCanvas = document.getElementById("zoomCanvas");
        const zoomCtx = zoomCanvas.getContext("2d");
        zoomCanvas.width = 600; zoomCanvas.height = 240;

        function updateZoom() {
            if (!selectedBox || !freezeDone) {
                zoomBox.style.display = "none";
                return;
            }
            zoomBox.style.display = "block";
            zoomCtx.clearRect(0, 0, 600, 240);
            zoomCtx.drawImage(freezeCanvas, selectedBox.x, selectedBox.y, selectedBox.w, selectedBox.h, 0, 0, 600, 240);
        }

        function getCropCanvas(preprocess = false) {
            if (!selectedBox) return null;
            let crop = document.createElement("canvas");
            crop.width = selectedBox.w;
            crop.height = selectedBox.h;
            let ctx = crop.getContext("2d");
            ctx.drawImage(freezeCanvas, selectedBox.x, selectedBox.y, selectedBox.w, selectedBox.h, 0, 0, selectedBox.w, selectedBox.h);

            if (preprocess) {
                preprocessCropImage(crop);
            }
            return crop;
        }

        // 二值化預處理
        function preprocessCropImage(canvas) {
            const ctx = canvas.getContext("2d");
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let totalBrightness = 0;
            const pixelCount = data.length / 4;
            for (let i = 0; i < data.length; i += 4) {
                totalBrightness += (data[i] + data[i + 1] + data[i + 2]) / 3;
            }

            const avgBrightness = totalBrightness / pixelCount;
            const isDark = avgBrightness < 120;

            for (let i = 0; i < data.length; i += 4) {
                let brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                let value = isDark ? (brightness > 110 ? 0 : 255) : (brightness < 130 ? 0 : 255);
                data[i] = data[i + 1] = data[i + 2] = value;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // ===============================
        // AI 辨識流程
        // ===============================
        let ocrCandidates = [];

        async function runOCR() {
            if (!selectedBox) { alert("請先劃定品號區域！"); return; }

            status.innerHTML = "正在辨識中，請稍候...";
            ocrCandidates = [];

            let rawCrop = getCropCanvas(false);
            let processedCrop = getCropCanvas(true);

            // 1. Google ML Kit 條碼掃描
            if (barcodeDetector) {
                try {
                    const barcodes = await barcodeDetector.detect(rawCrop);
                    barcodes.forEach(b => {
                        let val = b.rawValue ? b.rawValue.trim().toUpperCase() : "";
                        if (val && !ocrCandidates.find(c => c.code === val)) {
                            ocrCandidates.push({ code: val, score: 100, isBarcode: true });
                        }
                    });
                } catch (e) { console.log(e); }
            }

            // 2. OCR 辨識 (雙軌：原圖 + 預處理圖)
            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-*/',
                    tessedit_pageseg_mode: '6',
                    load_system_dawg: '0', load_freq_dawg: '0'
                });

                // A. 原圖辨識
                const resRaw = await worker.recognize(rawCrop);
                let textRaw = resRaw.data.text.trim();
                let cleanRaw = textRaw.replace(/[^A-Za-z0-9\-*/]/g, '').toUpperCase();
                if (cleanRaw) ocrCandidates.push({ code: cleanRaw, score: Math.round(resRaw.data.confidence), isBarcode: false });

                // B. 二值化圖辨識
                const resProcessed = await worker.recognize(processedCrop);
                let textProc = resProcessed.data.text.trim();
                let cleanProc = textProc.replace(/[^A-Za-z0-9\-*/]/g, '').toUpperCase();
                if (cleanProc && !ocrCandidates.find(c => c.code === cleanProc)) {
                    ocrCandidates.push({ code: cleanProc, score: Math.round(resProcessed.data.confidence), isBarcode: false });
                }

                await worker.terminate();

                if (cleanRaw) generateSimilarCandidates(cleanRaw);

            } catch (e) {
                status.innerHTML = "OCR 辨識發生錯誤：" + e.message;
            }

            showOCRResults();
        }

        function generateSimilarCandidates(code) {
            let list = [];
            if (code.includes("0")) list.push(code.replace(/0/g, "O"));
            if (code.includes("O")) list.push(code.replace(/O/g, "0"));
            if (code.includes("1")) list.push(code.replace(/1/g, "I"));
            if (code.includes("I")) list.push(code.replace(/I/g, "1"));

            list.forEach(x => {
                if (!ocrCandidates.find(y => y.code === x)) {
                    ocrCandidates.push({ code: x, score: 60, isBarcode: false });
                }
            });
        }

        function showOCRResults() {
            let panel = document.getElementById("resultPanel");
            let results = document.getElementById("results");
            results.innerHTML = "";

            if (ocrCandidates.length === 0) {
                status.innerHTML = "未辨識出文字，請手動輸入品號：";
            } else {
                status.innerHTML = "辨識完成，請點選正確品號：";
                ocrCandidates.forEach(item => {
                    let div = document.createElement("div");
                    div.className = "result-item";
                    let tag = item.isBarcode ? " <span style='color:red;'>[條碼]</span>" : "";
                    div.innerHTML = `${formatDisplayCode(item.code)}${tag} <br><small style='color:#666;'>信心值：${item.score}%</small>`;
                    div.onclick = function () {
                        document.getElementById("manualCode").value = formatDisplayCode(item.code);
                    };
                    results.appendChild(div);
                });
                document.getElementById("manualCode").value = formatDisplayCode(ocrCandidates[0].code);
            }
            panel.style.display = "block";
        }

        function formatDisplayCode(str) {
            return str.replace(/\*/g, "＊").replace(/\//g, "／");
        }

        function confirmCode() {
            let code = document.getElementById("manualCode").value.trim();
            if (!code) { alert("請輸入品號！"); return; }

            confirmedCode = code;

            document.getElementById("resultPanel").style.display = "none";
            document.getElementById("cameraBox").style.display = "none";
            document.getElementById("zoomBox").style.display = "none";
            document.getElementById("productBox").style.display = "block";
            document.getElementById("takeProductBtn").style.display = "inline-block";

            document.getElementById("stepTitle").innerHTML = "第二階段：拍攝產品圖 (品號：" + confirmedCode + ")";
            status.innerHTML = "請對準產品，按「📸 拍產品圖」";

            openProductCamera();
        }

        // ===============================
        // 第二階段：產品拍照 / 存檔
        // ===============================
        const productVideo = document.getElementById("productVideo");
        const productCanvas = document.getElementById("productCanvas");
        const productCtx = productCanvas.getContext("2d");

        async function openProductCamera() {
            try {
                let pStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                productVideo.srcObject = pStream;
            } catch (e) { alert("產品鏡頭錯誤：" + e.message); }
        }

        function takeProductPhoto() {
            const targetW = 284; const targetH = 257;
            const vw = productVideo.videoWidth || 1920;
            const vh = productVideo.videoHeight || 1080;

            const targetRatio = targetW / targetH;
            const videoRatio = vw / vh;
            let sx, sy, sw, sh;

            if (videoRatio > targetRatio) {
                sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
            } else {
                sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
            }

            productCanvas.width = targetW; productCanvas.height = targetH;
            productCtx.clearRect(0, 0, targetW, targetH);
            productCtx.drawImage(productVideo, sx, sy, sw, sh, 0, 0, targetW, targetH);

            status.innerHTML = "照片已拍攝！請點擊「💾 確認存檔」";
            document.getElementById("saveBtn").style.display = "inline-block";
        }

        function setJpegDpi(base64, dpi) {
            let binary = atob(base64.split(",")[1]);
            let bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            for (let i = 0; i < bytes.length - 9; i++) {
                if (bytes[i] === 0xFF && bytes[i + 1] === 0xE0) {
                    bytes[i + 11] = 1;
                    bytes[i + 12] = (dpi >> 8) & 255;
                    bytes[i + 13] = dpi & 255;
                    bytes[i + 14] = (dpi >> 8) & 255;
                    bytes[i + 15] = dpi & 255;
                    break;
                }
            }
            let result = "";
            bytes.forEach(b => { result += String.fromCharCode(b); });
            return "data:image/jpeg;base64," + btoa(result);
        }

        function saveImage() {
            let raw = productCanvas.toDataURL("image/jpeg", 0.95);
            let finalImage = setJpegDpi(raw, 72);
            let filename = confirmedCode + ".jpg";

            let link = document.createElement("a");
            link.href = finalImage;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert("已存檔：" + filename);
            resetSystem();
        }

        function resetSystem() {
            confirmedCode = "";
            unfreezeImage();

            document.getElementById("productBox").style.display = "none";
            document.getElementById("takeProductBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "none";

            document.getElementById("cameraBox").style.display = "block";
            document.getElementById("stepTitle").innerHTML = "第一階段：品號辨識";
            status.innerHTML = "已重置，請開啟鏡頭開始下一筆";
        }
    </script>
</body>
</html>
