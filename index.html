<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>門市品號辨識系統 V3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            margin: 0;
        }

        h2 { margin: 10px 0; font-size: 20px; }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: #007bff;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 第一階段 1200x800 取景與劃框容器 */
        .camera-area {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 1200 / 800;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #ff9800;
            border-radius: 8px;
            touch-action: none;
        }

        /* 第二階段 284x257 產品拍照容器 */
        .product-area {
            width: 284px;
            height: 257px;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #28a745;
            border-radius: 8px;
        }

        video.layer, canvas.layer {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            object-fit: cover;
        }

        #video { z-index: 1; }
        #freezeCanvas { z-index: 3; display: none; }
        #boxCanvas { z-index: 5; }

        #productFreezeCanvas {
            z-index: 4;
            display: none;
        }

        /* 放大鏡 */
        #zoomBox {
            display: none;
            width: 320px;
            height: 130px;
            margin: 10px auto;
            border: 2px solid #333;
            background: white;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #zoomCanvas { width: 100%; height: 100%; }

        button {
            padding: 8px 14px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { background: #ccc; }
        .green { background: #28a745; }
        .orange { background: #ff9800; }
        .gray { background: #6c757d; }
        .red { background: #dc3545; }
        .purple { background: #6f42c1; }

        #status { font-weight: bold; margin: 10px; color: #333; font-size: 14px; }

        #resultPanel {
            max-width: 350px;
            margin: 10px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }

        .result-item {
            padding: 12px;
            margin: 6px 0;
            background: #f8f9fa;
            border: 2px solid #ddd;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .result-item.selected {
            background: #e7f1ff;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
            color: #0056b3;
        }

        .transform-controls {
            margin: 10px auto;
            max-width: 900px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: none;
        }

        .slider-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .slider-group input[type=range] {
            width: 50%;
        }
    </style>
</head>
<body>

    <h2>門市品號辨識系統 V3.0</h2>

    <div id="stepTitle" class="badge">第一階段：品號辨識</div>

    <div id="cameraBox" class="camera-area">
        <video id="video" class="layer" autoplay playsinline></video>
        <canvas id="freezeCanvas" class="layer" width="1200" height="800"></canvas>
        <canvas id="boxCanvas" class="layer" width="1200" height="800"></canvas>
    </div>

    <div id="transformBar" class="transform-controls">
        <div class="slider-group">
            <span style="font-weight:bold; font-size:14px;">旋轉角度:</span>
            <button onclick="stepRotate(-1)" class="purple">-1°</button>
            <input type="range" id="rotateSlider" min="-180" max="180" value="0" oninput="onRotateSliderChange(this.value)">
            <button onclick="stepRotate(1)" class="purple">+1°</button>
            <span id="degVal" style="font-weight:bold; min-width:40px;">0°</span>
        </div>
        <div>
            <button onclick="stepRotate(-90)" class="purple">↶ -90°</button>
            <button onclick="stepRotate(90)" class="purple">↷ +90°</button>
            <button onclick="zoomImage(1.15)" class="purple">🔍 放大</button>
            <button onclick="zoomImage(0.85)" class="purple">🔍 縮小</button>
            <button onclick="resetImageTransform()" class="gray">重置圖像</button>
        </div>
        <div style="margin-top: 5px;">
            <span style="font-size:13px; color:#666;">位置微調: </span>
            <button onclick="moveOffset(0, -30)" class="gray">⬆ 上</button>
            <button onclick="moveOffset(0, 30)" class="gray">⬇ 下</button>
            <button onclick="moveOffset(-30, 0)" class="gray">⬅ 左</button>
            <button onclick="moveOffset(30, 0)" class="gray">➡ 右</button>
        </div>
    </div>

    <div id="zoomBox">
        <canvas id="zoomCanvas" width="600" height="240"></canvas>
    </div>

    <div>
        <button id="startCamBtn" onclick="startCamera()">📷 開啟鏡頭</button>
        <button id="captureBtn" onclick="freezeImage()" disabled class="orange">📸 定格畫面</button>
        <button id="retakeBtn" onclick="unfreezeImage()" style="display:none;" class="red">🔄 重拍/取消定格</button>
        <button id="ocrBtn" onclick="runOCR()" style="display:none;" class="green">🔍 辨識框內品號</button>
        <button id="clearBoxBtn" onclick="resetBox()" style="display:none;" class="gray">清空框</button>
    </div>

    <div id="status">請點擊「開啟鏡頭」</div>

    <div id="resultPanel">
        <h3 style="margin-top:0;">確認品號</h3>
        <div id="results"></div>
        <p style="margin:5px 0; font-size:12px; color:#666;">可點選上方建議或在此手動修改：</p>
        <input id="manualCode" placeholder="請輸入品號">
        <button onclick="confirmCode()" class="green" style="width:100%; font-size:18px;">確認品號 ➔ 下一步</button>
    </div>

    <div id="productBox" class="product-area" style="display:none">
        <video id="productVideo" class="layer" autoplay playsinline></video>
        <canvas id="productFreezeCanvas" class="layer" width="284" height="257"></canvas>
    </div>

    <div>
        <button id="takeProductBtn" style="display:none" class="green" onclick="takeProductPhoto()">📸 拍產品圖</button>
        <button id="retakeProductBtn" style="display:none" class="orange" onclick="retakeProductPhoto()">🔄 重拍</button>
        <button id="saveBtn" style="display:none" class="green" onclick="saveImage()">💾 確認存檔</button>
    </div>

    <canvas id="rawSnapshotCanvas" width="1200" height="800" style="display:none;"></canvas>
    <canvas id="productCanvas" width="284" height="257" style="display:none;"></canvas>

    <script>
        const video = document.getElementById("video");
        const freezeCanvas = document.getElementById("freezeCanvas");
        const freezeCtx = freezeCanvas.getContext("2d");

        const rawSnapshotCanvas = document.getElementById("rawSnapshotCanvas");
        const rawSnapshotCtx = rawSnapshotCanvas.getContext("2d");

        const boxCanvas = document.getElementById("boxCanvas");
        const boxCtx = boxCanvas.getContext("2d");

        const status = document.getElementById("status");
        const startCamBtn = document.getElementById("startCamBtn");
        const captureBtn = document.getElementById("captureBtn");
        const retakeBtn = document.getElementById("retakeBtn");
        const ocrBtn = document.getElementById("ocrBtn");
        const clearBoxBtn = document.getElementById("clearBoxBtn");
        const transformBar = document.getElementById("transformBar");
        const rotateSlider = document.getElementById("rotateSlider");
        const degVal = document.getElementById("degVal");

        let activeStream = null;
        let freezeDone = false;
        let selectedBox = null;
        let confirmedCode = "";
        let barcodeDetector = null;

        let imgRotation = 0;
        let imgScale = 1.0;
        let offsetX = 0;
        let offsetY = 0;

        if ('BarcodeDetector' in window) {
            try {
                barcodeDetector = new BarcodeDetector({
                    formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'upc_a']
                });
            } catch (e) { barcodeDetector = new BarcodeDetector(); }
        }

        // 安全停止當前相機串流，避免卡死黑屏
        function stopCurrentStream() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
        }

        // 1. 啟動第一階段相機
        async function startCamera() {
            stopCurrentStream();
            status.innerHTML = "正在啟動鏡頭...";
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = activeStream;
                captureBtn.disabled = false;
                startCamBtn.style.display = "none";
                status.innerHTML = "請對準品號後按下「📸 定格畫面」";
            } catch (e) {
                alert("無法開啟鏡頭：" + e.message);
                status.innerHTML = "鏡頭啟動失敗：" + e.message;
            }
        }

        function freezeImage() {
            const vw = video.videoWidth || 1920;
            const vh = video.videoHeight || 1080;
            const targetRatio = 1200 / 800;
            const videoRatio = vw / vh;

            let sx, sy, sw, sh;
            if (videoRatio > targetRatio) {
                sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
            } else {
                sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
            }

            rawSnapshotCtx.clearRect(0, 0, 1200, 800);
            rawSnapshotCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 1200, 800);

            resetImageTransform();

            freezeCanvas.style.display = "block";
            freezeDone = true;

            captureBtn.style.display = "none";
            retakeBtn.style.display = "inline-block";
            ocrBtn.style.display = "inline-block";
            clearBoxBtn.style.display = "inline-block";
            transformBar.style.display = "block";

            status.innerHTML = "畫面已定格！滑動旋轉或縮放調整，再畫綠框辨識";
            createDefaultBox();
        }

        function renderTransformedImage() {
            freezeCtx.clearRect(0, 0, 1200, 800);
            freezeCtx.save();

            freezeCtx.translate(600 + offsetX, 400 + offsetY);
            freezeCtx.rotate((imgRotation * Math.PI) / 180);
            freezeCtx.scale(imgScale, imgScale);

            freezeCtx.drawImage(rawSnapshotCanvas, -600, -400);
            freezeCtx.restore();

            updateZoom();
        }

        function onRotateSliderChange(val) {
            imgRotation = parseInt(val);
            degVal.innerText = imgRotation + "°";
            renderTransformedImage();
        }

        function stepRotate(deg) {
            imgRotation = (imgRotation + deg) % 360;
            if (imgRotation > 180) imgRotation -= 360;
