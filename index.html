<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門市品號辨識系統</title>
    <!-- 載入 Tesseract.js OCR 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f5f5f5;
        }
        /* 取景框：284:257 比例 */
        .camera-container {
            width: 284px;
            height: 257px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 3px solid #007bff;
            border-radius: 8px;
            background-color: #000;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            margin: 5px; 
            cursor: pointer; 
            border-radius: 5px;
            border: none;
            background-color: #007bff;
            color: white;
        }
        button:disabled { background-color: #ccc; }
        #status { font-weight: bold; margin: 10px; color: #333; }
        
        /* 選項面板樣式 */
        #selectionPanel {
            display: none;
            max-width: 320px;
            margin: 15px auto;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: left;
            color: #333;
            font-size: 15px;
            font-weight: bold;
        }
        .option-item:hover, .option-item:active { 
            background: #e2e6ea; 
            border-color: #007bff;
        }
        .custom-input-group {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }
        .custom-input-group input {
            width: calc(100% - 22px);
            padding: 10px;
            font-size: 16px;
            margin-bottom: 8px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        /* 隱藏輔助 Canvas */
        #highResCanvas, #targetCanvas { display: none; }
    </style>
</head>
<body>

    <h2>門市產品辨識系統</h2>
    
    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
    </div>
    
    <div>
        <button id="startBtn" onclick="initCamera()">📷 開啟鏡頭</button>
        <button id="captureBtn" onclick="captureAndRecognize()" disabled>🔍 擷取並辨識</button>
    </div>
    
    <div id="status">請點擊「開啟鏡頭」</div>

    <!-- 辨識結果候選清單面板 -->
    <div id="selectionPanel">
        <p style="margin-top:0; font-weight:bold; color:#007bff;">請點選可能品號帶入下方：</p>
        <div id="optionsContainer"></div>
        
        <div class="custom-input-group">
            <p style="margin:5px 0; font-size:14px; font-weight:bold; color:#333;">確認/微調品號：</p>
            <input type="text" id="manualInput" placeholder="請點選上方選項或在此輸入...">
            <button style="width:100%; background:#28a745; font-size:18px; font-weight:bold; padding:12px;" onclick="submitManual()">✅ 確認並下載</button>
        </div>
    </div>

    <!-- 1. 高解析度 Canvas (辨識用) -->
    <canvas id="highResCanvas"></canvas>
    <!-- 2. 284x257 最終輸出 Canvas (存檔用) -->
    <canvas id="targetCanvas" width="284" height="257"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const highResCanvas = document.getElementById('highResCanvas');
        const targetCanvas = document.getElementById('targetCanvas');
        const highResCtx = highResCanvas.getContext('2d');
        const targetCtx = targetCanvas.getContext('2d');

        const statusDiv = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');
        const selectionPanel = document.getElementById('selectionPanel');
        const optionsContainer = document.getElementById('optionsContainer');
        const manualInput = document.getElementById('manualInput');

        // 1. 初始化鏡頭
        async function initCamera() {
            statusDiv.innerText = "正在啟動鏡頭...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                captureBtn.disabled = false;
                statusDiv.innerText = "請將品號對準取景框，點擊擷取";
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    captureBtn.disabled = false;
                    statusDiv.innerText = "已啟用備用鏡頭";
                } catch (e) {
                    statusDiv.innerText = "無法取得鏡頭權限：" + e.message;
                }
            }
        }

        // 2. 高畫質 AI 辨識
        async function captureAndRecognize() {
            selectionPanel.style.display = "none";
            optionsContainer.innerHTML = "";
            manualInput.value = "";
            statusDiv.innerText = "正在高解析度擷取並進行 AI 辨識...";

            const vWidth = video.videoWidth || 1280;
            const vHeight = video.videoHeight || 720;

            highResCanvas.width = vWidth;
            highResCanvas.height = vHeight;
            highResCtx.drawImage(video, 0, 0, vWidth, vHeight);

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/*',
                    tessedit_pageseg_mode: '6',
                });

                const { data: { lines } } = await worker.recognize(highResCanvas);
                await worker.terminate();

                let candidates = [];
                lines.forEach(line => {
                    let clean = line.text.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
                    
                    const hasLetter = /[A-Z]/.test(clean);
                    const hasNumber = /[0-9]/.test(clean);

                    if (clean.length >= 4 && hasLetter && hasNumber && !candidates.includes(clean)) {
                        candidates.push(clean);
                    }
                });

                if (candidates.length === 0) {
                    statusDiv.innerText = "未辨識出有效品號，請手動輸入：";
                    showSelectionPanel([]);
                    return;
                }

                statusDiv.innerText = `辨識成功！請選擇或點擊下方欄位微調：`;
                showSelectionPanel(candidates);

            } catch (err) {
                statusDiv.innerText = "辨識發生錯誤：" + err.message;
            }
        }

        // 3. 顯示選單面板：點擊將文字帶入 input 輸入框
        function showSelectionPanel(candidates) {
            optionsContainer.innerHTML = "";
            
            candidates.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = text;
                // 點擊選項時，將內容帶入到下方輸入框中
                btn.onclick = () => {
                    manualInput.value = text;
                    manualInput.focus(); // 自動將游標移至輸入框方便使用者微調
                };
                optionsContainer.appendChild(btn);
            });

            // 預設將第一筆最可能的辨識結果自動填入輸入框，節省操作時間
            if (candidates.length > 0) {
                manualInput.value = candidates[0];
            }

            selectionPanel.style.display = "block";
        }

        // 4. 手動輸入提交 (從 input 輸入框讀取最終確認的品號)
        function submitManual() {
            const val = manualInput.value.trim();
            if (!val) { 
                alert("請輸入品號！"); 
                return; 
            }
            processAndSave(val);
        }

        // 5. 處理轉換與觸發手機下載儲存
        function processAndSave(rawText) {
            let cleanText = rawText.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
            
            // 檔名判斷規則：只有 * 或 / 轉全形，- 保持半形
            const needsFullWidth = /[*\/]/.test(cleanText);
            let finalFileName = needsFullWidth ? toFullWidth(cleanText) : cleanText;

            statusDiv.innerText = `已確認品號：${finalFileName}，正在生成圖片...`;

            // 繪製縮放到 284x257px
            targetCtx.drawImage(highResCanvas, 0, 0, 284, 257);
            
            // 轉為 Base64 並寫入 72 DPI 檔頭
            const rawTargetDataURL = targetCanvas.toDataURL('image/jpeg', 0.95);
            const finalImageBase64 = setJpegDpi(rawTargetDataURL, 72);

            // 觸發手機下載
            downloadImageToMobile(finalImageBase64, finalFileName + ".jpg");

            statusDiv.innerText = `已儲存圖檔！檔名：${finalFileName}.jpg (284x257, 72 DPI)`;
            selectionPanel.style.display = "none";
        }

        // 6. 下載圖片至手機的函式
        function downloadImageToMobile(base64Data, fileName) {
            const link = document.createElement('a');
            link.href = base64Data;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 7. 全形轉換
        function toFullWidth(str) {
            return str.replace(/[\u0021-\u007E]/g, s => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));
        }

        // 8. 寫入 72 DPI Header
        function setJpegDpi(base64Image, dpi) {
            const byteString = atob(base64Image.split(',')[1]);
            const buffer = new Uint8Array(byteString.length);
            for (let i = 0; i < byteString.length; i++) {
                buffer[i] = byteString.charCodeAt(i);
            }

            if (buffer[0] === 0xFF && buffer[1] === 0xD8) {
                let offset = 2;
                while (offset < buffer.length) {
                    if (buffer[offset] === 0xFF && buffer[offset + 1] === 0xE0) {
                        buffer[offset + 11] = 1;
                        buffer[offset + 12] = (dpi >> 8) & 0xFF;
                        buffer[offset + 13] = dpi & 0xFF;
                        buffer[offset + 14] = (dpi >> 8) & 0xFF;
                        buffer[offset + 15] = dpi & 0xFF;
                        break;
                    }
                    offset += 1 + buffer[offset + 2];
                }
            }

            let binary = '';
            for (let i = 0; i < buffer.byteLength; i++) {
                binary += String.fromCharCode(buffer[i]);
            }
            return 'data:image/jpeg;base64,' + btoa(binary);
        }
    </script>
</body>
</html>
