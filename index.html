<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門市品號辨識系統</title>
    <!-- 載入 Tesseract.js OCR 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f5f5f5;
        }
        
        .step-badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 階段 1 取景框：3:1 比例 (寬 300px, 高 100px) */
        .camera-container-step1 {
            width: 300px;
            height: 100px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 3px solid #ff9800; /* 橘框代表 3:1 辨識模式 */
            border-radius: 8px;
            background-color: #000;
        }

        /* 階段 2 取景框：284x257 比例 */
        .camera-container-step2 {
            width: 284px;
            height: 257px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 3px solid #28a745; /* 綠框代表產品拍照模式 */
            border-radius: 8px;
            background-color: #000;
        }

        .webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            margin: 5px; 
            cursor: pointer; 
            border-radius: 5px;
            border: none;
            background-color: #007bff;
            color: white;
        }
        button:disabled { background-color: #ccc; }
        .btn-green { background-color: #28a745; }
        
        #status { font-weight: bold; margin: 10px; color: #333; }
        
        #selectionPanel {
            display: none;
            max-width: 320px;
            margin: 15px auto;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: left;
            color: #333;
            font-size: 15px;
            font-weight: bold;
        }
        .option-item:hover, .option-item:active { 
            background: #e2e6ea; 
            border-color: #007bff;
        }
        .custom-input-group {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }
        .custom-input-group input {
            width: calc(100% - 22px);
            padding: 10px;
            font-size: 16px;
            margin-bottom: 8px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #ocrCanvas, #productCanvas { display: none; }
    </style>
</head>
<body>

    <h2>門市產品辨識系統</h2>
    <div id="stepBadge" class="step-badge">第一階段：拍攝並辨識品號 (3:1 視窗)</div>

    <!-- 視訊取景容器（預設為 3:1 框） -->
    <div id="cameraBox" class="camera-container-step1">
        <video id="webcam" class="webcam-video" autoplay playsinline></video>
    </div>
    
    <div>
        <button id="startBtn" onclick="initCamera()">📷 開啟鏡頭</button>
        <button id="captureOCRBtn" onclick="captureAndRecognize()" disabled>🔍 1. 擷取品號</button>
        <button id="captureProductBtn" class="btn-green" onclick="captureProductImage()" style="display:none;">📸 2. 拍產品圖並存檔</button>
    </div>
    
    <div id="status">請點擊「開啟鏡頭」</div>

    <!-- 第一階段：辨識結果微調面板 -->
    <div id="selectionPanel">
        <p style="margin-top:0; font-weight:bold; color:#007bff;">請點選可能品號帶入下方：</p>
        <div id="optionsContainer"></div>
        
        <div class="custom-input-group">
            <p style="margin:5px 0; font-size:14px; font-weight:bold; color:#333;">確認/微調品號：</p>
            <input type="text" id="manualInput" placeholder="請點選上方選項或在此輸入...">
            <button style="width:100%; font-size:16px; font-weight:bold; padding:12px;" onclick="confirmCodeAndGoToStep2()">下一步：拍攝產品圖 ➔</button>
        </div>
    </div>

    <!-- 輔助繪圖 Canvas -->
    <canvas id="ocrCanvas"></canvas>
    <canvas id="productCanvas" width="284" height="257"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const cameraBox = document.getElementById('cameraBox');
        const stepBadge = document.getElementById('stepBadge');
        const statusDiv = document.getElementById('status');
        
        const captureOCRBtn = document.getElementById('captureOCRBtn');
        const captureProductBtn = document.getElementById('captureProductBtn');
        
        const selectionPanel = document.getElementById('selectionPanel');
        const optionsContainer = document.getElementById('optionsContainer');
        const manualInput = document.getElementById('manualInput');

        const ocrCanvas = document.getElementById('ocrCanvas');
        const productCanvas = document.getElementById('productCanvas');
        const ocrCtx = ocrCanvas.getContext('2d');
        const productCtx = productCanvas.getContext('2d');

        let confirmedFileName = "";

        // 1. 初始化鏡頭 (請求最高畫質原尺寸)
        async function initCamera() {
            statusDiv.innerText = "正在啟動鏡頭...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        // 要求原生高解析度畫質
                        width: { ideal: 3840 },
                        height: { ideal: 2160 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                captureOCRBtn.disabled = false;
                statusDiv.innerText = "請將品號對準 3:1 橘色視窗，點擊「擷取品號」";
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    captureOCRBtn.disabled = false;
                    statusDiv.innerText = "已啟用備用鏡頭";
                } catch (e) {
                    statusDiv.innerText = "無法取得鏡頭權限：" + e.message;
                }
            }
        }

        // 2. 第一階段：完全使用手機原始解析度 (Full Native Pixel) 辨識
        async function captureAndRecognize() {
            selectionPanel.style.display = "none";
            optionsContainer.innerHTML = "";
            manualInput.value = "";
            statusDiv.innerText = "正在讀取高解析度畫面並進行 AI 辨識...";

            // 抓取相機實體的原始最高像素 (如 4032x3024 / 1920x1080)
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;

            // 完全不調整解析度，直接繪製 1:1 原圖
            ocrCanvas.width = vWidth;
            ocrCanvas.height = vHeight;
            ocrCtx.drawImage(video, 0, 0, vWidth, vHeight);

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/*',
                    tessedit_pageseg_mode: '6',
                });

                // 傳送原始解析度影像進行辨識
                const { data: { lines } } = await worker.recognize(ocrCanvas);
                await worker.terminate();

                let candidates = [];
                lines.forEach(line => {
                    let clean = line.text.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
                    const hasLetter = /[A-Z]/.test(clean);
                    const hasNumber = /[0-9]/.test(clean);

                    if (clean.length >= 4 && hasLetter && hasNumber && !candidates.includes(clean)) {
                        candidates.push(clean);
                    }
                });

                if (candidates.length === 0) {
                    statusDiv.innerText = "未辨識出有效品號，請手動輸入：";
                    showSelectionPanel([]);
                    return;
                }

                statusDiv.innerText = `辨識完成！請點選或微調品號：`;
                showSelectionPanel(candidates);

            } catch (err) {
                statusDiv.innerText = "辨識發生錯誤：" + err.message;
            }
        }

        // 3. 顯示選項面板
        function showSelectionPanel(candidates) {
            optionsContainer.innerHTML = "";
            candidates.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = text;
                btn.onclick = () => {
                    manualInput.value = text;
                    manualInput.focus();
                };
                optionsContainer.appendChild(btn);
            });

            if (candidates.length > 0) {
                manualInput.value = candidates[0];
            }
            selectionPanel.style.display = "block";
        }

        // 4. 確認第一階段品號，切換至第二階段
        function confirmCodeAndGoToStep2() {
            const rawText = manualInput.value.trim();
            if (!rawText) {
                alert("請輸入品號！");
                return;
            }

            let cleanText = rawText.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
            
            // 檔名全半形規則：只有 * 或 / 轉全形，- 保持半形
            const needsFullWidth = /[*\/]/.test(cleanText);
            confirmedFileName = needsFullWidth ? toFullWidth(cleanText) : cleanText;

            selectionPanel.style.display = "none";
            captureOCRBtn.style.display = "none";
            
            // 轉為 284x257 框
            cameraBox.className = "camera-container-step2";
            stepBadge.innerText = `第二階段：拍攝產品圖 (品號：${confirmedFileName})`;
            stepBadge.style.backgroundColor = "#28a745";
            
            captureProductBtn.style.display = "inline-block";
            statusDiv.innerText = `品號定案：[ ${confirmedFileName} ]！請對準綠框拍攝產品圖`;
        }

   // 5. 第二階段：拍攝產品圖（保持原比例中心裁切，絕不變形拉伸）
function captureProductImage() {
    statusDiv.innerText = "正在處理 284x257 (72 DPI) 圖片...";

    const targetWidth = 284;
    const targetHeight = 257;
    const videoWidth = video.videoWidth || 1280;
    const videoHeight = video.videoHeight || 720;

    // 計算 Cover (中心裁切) 比例
    const targetAspect = targetWidth / targetHeight; // 284 / 257 ≈ 1.105
    const videoAspect = videoWidth / videoHeight;   // 例如 16 / 9 ≈ 1.777

    let sx, sy, sWidth, sHeight;

    if (videoAspect > targetAspect) {
        // 鏡頭畫面太寬，以高度為基準，裁切左右兩邊
        sHeight = videoHeight;
        sWidth = videoHeight * targetAspect;
        sx = (videoWidth - sWidth) / 2;
        sy = 0;
    } else {
        // 鏡頭畫面太高，以寬度為基準，裁切上下兩邊
        sWidth = videoWidth;
        sHeight = videoWidth / targetAspect;
        sx = 0;
        sy = (videoHeight - sHeight) / 2;
    }

    // 清空 Canvas
    productCtx.clearRect(0, 0, targetWidth, targetHeight);

    // 從相機畫面的中心點 (sx, sy, sWidth, sHeight) 擷取，並等比例繪製到 284x257
    productCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);

    // 轉為 72 DPI 檔頭 Base64
    const rawDataURL = productCanvas.toDataURL('image/jpeg', 0.95);
    const finalImageBase64 = setJpegDpi(rawDataURL, 72);

    // 觸發下載
    downloadImageToMobile(finalImageBase64, confirmedFileName + ".jpg");

    statusDiv.innerText = `下載完成！完美裁切不變形：${confirmedFileName}.jpg (284x257, 72 DPI)`;
}
