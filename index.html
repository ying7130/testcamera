<script>
        const video = document.getElementById('webcam');
        const cameraBox = document.getElementById('cameraBox');
        const stepBadge = document.getElementById('stepBadge');
        const statusDiv = document.getElementById('status');
        
        const captureOCRBtn = document.getElementById('captureOCRBtn');
        const captureProductBtn = document.getElementById('captureProductBtn');
        
        const selectionPanel = document.getElementById('selectionPanel');
        const optionsContainer = document.getElementById('optionsContainer');
        const manualInput = document.getElementById('manualInput');

        const ocrCanvas = document.getElementById('ocrCanvas');
        const productCanvas = document.getElementById('productCanvas');
        const ocrCtx = ocrCanvas.getContext('2d');
        const productCtx = productCanvas.getContext('2d');

        let confirmedFileName = "";

        // 1. 初始化鏡頭 (兼顧高畫質與最佳相容性)
        async function initCamera() {
            statusDiv.innerText = "正在啟動鏡頭...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 2100 },
                        height: { ideal: 900 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                captureOCRBtn.disabled = false;
                statusDiv.innerText = "請將品號對準橘色視窗，點擊「擷取品號」";
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    video.srcObject = fallbackStream;
                    captureOCRBtn.disabled = false;
                    statusDiv.innerText = "已啟用鏡頭，請對準 3:1 視窗";
                } catch (e) {
                    statusDiv.innerText = "無法開啟鏡頭：" + e.message;
                    alert("鏡頭開啟失敗！請檢查是否使用 https:// 網址及相機權限。\n錯誤訊息：" + e.message);
                }
            }
        }

        // 2. 第一階段：完全使用手機原始解析度 (Full Native Pixel) 辨識
        async function captureAndRecognize() {
            selectionPanel.style.display = "none";
            optionsContainer.innerHTML = "";
            manualInput.value = "";
            statusDiv.innerText = "正在讀取高解析度畫面並進行 AI 辨識...";

            const vWidth = video.videoWidth || 1920;
            const vHeight = video.videoHeight || 1080;

            ocrCanvas.width = vWidth;
            ocrCanvas.height = vHeight;
            ocrCtx.drawImage(video, 0, 0, vWidth, vHeight);

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/*',
                    tessedit_pageseg_mode: '6',
                });

                const { data: { lines } } = await worker.recognize(ocrCanvas);
                await worker.terminate();

                let candidates = [];
                lines.forEach(line => {
                    let clean = line.text.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
                    const hasLetter = /[A-Z]/.test(clean);
                    const hasNumber = /[0-9]/.test(clean);

                    if (clean.length >= 4 && hasLetter && hasNumber && !candidates.includes(clean)) {
                        candidates.push(clean);
                    }
                });

                if (candidates.length === 0) {
                    statusDiv.innerText = "未辨識出有效品號，請手動輸入：";
                    showSelectionPanel([]);
                    return;
                }

                statusDiv.innerText = `辨識完成！請點選或微調品號：`;
                showSelectionPanel(candidates);

            } catch (err) {
                statusDiv.innerText = "辨識發生錯誤：" + err.message;
            }
        }

        // 3. 顯示選項面板
        function showSelectionPanel(candidates) {
            optionsContainer.innerHTML = "";
            candidates.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = text;
                btn.onclick = () => {
                    manualInput.value = text;
                    manualInput.focus();
                };
                optionsContainer.appendChild(btn);
            });

            if (candidates.length > 0) {
                manualInput.value = candidates[0];
            }
            selectionPanel.style.display = "block";
        }

        // 4. 確認第一階段品號，切換至第二階段
        function confirmCodeAndGoToStep2() {
            const rawText = manualInput.value.trim();
            if (!rawText) {
                alert("請輸入品號！");
                return;
            }

            let cleanText = rawText.replace(/[^A-Za-z0-9\/*-]/g, '').toUpperCase();
            
            const needsFullWidth = /[*\/]/.test(cleanText);
            confirmedFileName = needsFullWidth ? toFullWidth(cleanText) : cleanText;

            selectionPanel.style.display = "none";
            captureOCRBtn.style.display = "none";
            
            cameraBox.className = "camera-container-step2";
            stepBadge.innerText = `第二階段：拍攝產品圖 (品號：${confirmedFileName})`;
            stepBadge.style.backgroundColor = "#28a745";
            
            captureProductBtn.style.display = "inline-block";
            statusDiv.innerText = `品號定案：[ ${confirmedFileName} ]！請對準綠框拍攝產品圖`;
        }

        // 5. 第二階段：拍攝產品圖（保持原比例中心裁切，絕不變形拉伸）
        function captureProductImage() {
            statusDiv.innerText = "正在處理 284x257 (72 DPI) 圖片...";

            const targetWidth = 284;
            const targetHeight = 257;
            const videoWidth = video.videoWidth || 1280;
            const videoHeight = video.videoHeight || 720;

            // 計算 Cover (中心裁切) 比例
            const targetAspect = targetWidth / targetHeight; // 284 / 257 ≈ 1.105
            const videoAspect = videoWidth / videoHeight;   // 例如 16 / 9 ≈ 1.777

            let sx, sy, sWidth, sHeight;

            if (videoAspect > targetAspect) {
                // 鏡頭畫面太寬，以高度為基準，裁切左右兩邊
                sHeight = videoHeight;
                sWidth = videoHeight * targetAspect;
                sx = (videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                // 鏡頭畫面太高，以寬度為基準，裁切上下兩邊
                sWidth = videoWidth;
                sHeight = videoWidth / targetAspect;
                sx = 0;
                sy = (videoHeight - sHeight) / 2;
            }

            // 清空 Canvas
            productCtx.clearRect(0, 0, targetWidth, targetHeight);

            // 從相機畫面的中心點 (sx, sy, sWidth, sHeight) 擷取，並等比例繪製到 284x257
            productCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);

            // 轉為 72 DPI 檔頭 Base64
            const rawDataURL = productCanvas.toDataURL('image/jpeg', 0.95);
            const finalImageBase64 = setJpegDpi(rawDataURL, 72);

            // 觸發下載
            downloadImageToMobile(finalImageBase64, confirmedFileName + ".jpg");

            statusDiv.innerText = `下載完成！完美裁切不變形：${confirmedFileName}.jpg (284x257, 72 DPI)`;
        }

        // 6. 下載圖片至手機的函式 (不可漏掉)
        function downloadImageToMobile(base64Data, fileName) {
            const link = document.createElement('a');
            link.href = base64Data;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 7. 全形轉換函式 (不可漏掉)
        function toFullWidth(str) {
            return str.replace(/[\u0021-\u007E]/g, s => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));
        }

        // 8. 寫入 72 DPI Header 函式 (不可漏掉)
        function setJpegDpi(base64Image, dpi) {
            const byteString = atob(base64Image.split(',')[1]);
            const buffer = new Uint8Array(byteString.length);
            for (let i = 0; i < byteString.length; i++) {
                buffer[i] = byteString.charCodeAt(i);
            }

            if (buffer[0] === 0xFF && buffer[1] === 0xD8) {
                let offset = 2;
                while (offset < buffer.length) {
                    if (buffer[offset] === 0xFF && buffer[offset + 1] === 0xE0) {
                        buffer[offset + 11] = 1;
                        buffer[offset + 12] = (dpi >> 8) & 0xFF;
                        buffer[offset + 13] = dpi & 0xFF;
                        buffer[offset + 14] = (dpi >> 8) & 0xFF;
                        buffer[offset + 15] = dpi & 0xFF;
                        break;
                    }
                    offset += 1 + buffer[offset + 2];
                }
            }

            let binary = '';
            for (let i = 0; i < buffer.byteLength; i++) {
                binary += String.fromCharCode(buffer[i]);
            }
            return 'data:image/jpeg;base64,' + btoa(binary);
        }
    </script>
